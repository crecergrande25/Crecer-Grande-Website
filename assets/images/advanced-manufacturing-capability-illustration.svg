<!-- central route -->
<path d="M570 210h60M570 550h60" stroke="#f4b000" stroke-width="4" stroke-linecap="round" opacity=".9"/>
<path d="M612 202l18 8-18 8M612 542l18 8-18 8" fill="none" stroke="#f4b000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>