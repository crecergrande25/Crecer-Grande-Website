  <path d="M133 96h18l-4 22h-10z" fill="url(#gold)"/>
  <path d="M94 205h96" stroke="#8ba1b5" stroke-width="8" stroke-linecap="round"/>
  <path d="M110 198l20-38h28l18 38z" fill="#f4b000" opacity=".92"/>
  <path d="M120 176h46M125 165h36" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
  <g transform="translate(286 42)">
    <circle cx="78" cy="72" r="58" fill="#0c2845" stroke="#8ba2b8" stroke-opacity=".28"/>
    <path d="M78 32l15 24 28 3-18 21 5 28-30-12-30 12 5-28-18-21 28-3z" fill="url(#steel)"/>
    <circle cx="78" cy="72" r="16" fill="#071a36"/>
    <rect x="15" y="158" width="154" height="62" rx="16" fill="#0b2038"/>
    <rect x="31" y="176" width="45" height="28" rx="6" fill="url(#steel)"/>
    <circle cx="54" cy="190" r="8" fill="#071a36"/>
    <rect x="90" y="176" width="62" height="28" rx="6" fill="#b9c6d3"/>
  </g>
</g>

<!-- Inspection / custom part -->
<g transform="translate(630 408)" filter="url(#shadow)">
  <rect width="508" height="286" rx="26" fill="url(#panel)" stroke="#fff" stroke-opacity=".14"/>
  <rect x="34" y="40" width="440" height="196" rx="20" fill="#0a2038"/>
  <path d="M76 201h350" stroke="#70879c" stroke-width="7"/>
  <g transform="translate(86 82)">
    <rect x="0" y="52" width="154" height="46" rx="9" fill="url(#steel)"/>
    <circle cx="45" cy="75" r="20" fill="#071a36"/>
    <circle cx="112" cy="75" r="13" fill="#071a36"/>
    <rect x="58" y="0" width="40" height="64" rx="8" fill="url(#steel)"/>
    <rect x="69" y="14" width="18" height="34" rx="5" fill="#071a36"/>
  </g>
  <g transform="translate(282 74)">
    <path d="M18 20h130v16H18z" fill="#d2dae2"/>
    <path d="M18 20v116M148 20v116" stroke="#d2dae2" stroke-width="12" stroke-linecap="round"/>
    <path d="M35 118h96" stroke="#d2dae2" stroke-width="12" stroke-linecap="round"/>
    <rect x="56" y="54" width="72" height="42" rx="9" fill="#112f4c"/>
    <path d="M70 74h44" stroke="#f4b000" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(80 245)">
    <circle cx="0" cy="0" r="5" fill="#f4b000"/><path d="M14 0h120" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="170" cy="0" r="5" fill="#f4b000"/><path d="M184 0h120" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="340" cy="0" r="5" fill="#f4b000"/>
  </g>
