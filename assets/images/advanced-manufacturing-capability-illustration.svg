<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
<title id="t">Advanced manufacturing capability illustration</title>
<desc id="d">A premium industrial illustration showing CNC machining, laser fabrication, 3D printing and custom component production.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06172d"/>
    <stop offset=".58" stop-color="#0a3158"/>
    <stop offset="1" stop-color="#0d527c"/>
  </linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f7fb"/><stop offset=".45" stop-color="#b8c5d2"/><stop offset="1" stop-color="#6f8296"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffd65a"/><stop offset=".55" stop-color="#f4b000"/><stop offset="1" stop-color="#d88900"/>
  </linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020a14" flood-opacity=".35"/>
  </filter>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
    <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/>
  </pattern>
</defs>

<rect width="1200" height="760" rx="36" fill="url(#bg)"/>
<rect width="1200" height="760" rx="36" fill="url(#grid)"/>
<circle cx="1080" cy="90" r="180" fill="#f4b000" opacity=".08"/>
<circle cx="150" cy="690" r="220" fill="#1b78b8" opacity=".10"/>

<!-- CNC cell -->
<g transform="translate(62 74)" filter="url(#shadow)">
  <rect width="508" height="274" rx="26" fill="url(#panel)" stroke="#fff" stroke-opacity=".14"/>
  <rect x="34" y="38" width="212" height="178" rx="18" fill="#0b2038" stroke="#8ba2b8" stroke-opacity=".35"/>
  <rect x="62" y="62" width="156" height="112" rx="10" fill="#152f49"/>
  <rect x="130" y="48" width="20" height="74" rx="7" fill="url(#steel)"/>
  <path d="M118 115h44l-8 38h-28z" fill="url(#steel)"/>
  <circle cx="140" cy="143" r="20" fill="#071a36" stroke="#f4b000" stroke-width="5"/>
  <rect x="78" y="186" width="124" height="14" rx="7" fill="#607990"/>
  <rect x="284" y="60" width="176" height="26" rx="13" fill="#0b2038"/>
  <rect x="284" y="101" width="176" height="82" rx="16" fill="#0d263f" stroke="#fff" stroke-opacity=".12"/>
  <path d="M304 162c25-40 54-57 88-50 20 4 36 16 50 34" fill="none" stroke="#f4b000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="323" cy="143" r="5" fill="#f4b000"/><circle cx="370" cy="121" r="5" fill="#f4b000"/><circle cx="424" cy="144" r="5" fill="#f4b000"/>
  <g transform="translate(290 204)">
    <rect width="54" height="28" rx="5" fill="url(#steel)"/><circle cx="27" cy="14" r="8" fill="#071a36"/>
    <rect x="68" width="74" height="28" rx="5" fill="url(#steel)"/><rect x="87" y="8" width="36" height="12" rx="3" fill="#071a36"/>
  </g>
</g>

<!-- Laser fabrication -->
<g transform="translate(630 74)" filter="url(#shadow)">
  <rect width="508" height="274" rx="26" fill="url(#panel)" stroke="#fff" stroke-opacity=".14"/>
  <rect x="38" y="54" width="432" height="148" rx="18" fill="#0b2038" stroke="#fff" stroke-opacity=".10"/>
  <path d="M60 178h390" stroke="#69829a" stroke-width="5"/>
  <g opacity=".5">
    <path d="M80 165l30 13 30-13 30 13 30-13 30 13 30-13 30 13 30-13 30 13 30-13 30 13" fill="none" stroke="#7f95aa" stroke-width="3"/>
  </g>
  <rect x="234" y="24" width="42" height="96" rx="10" fill="url(#steel)"/>
  <path d="M242 120h26l-8 36h-10z" fill="url(#gold)"/>
  <circle cx="255" cy="160" r="8" fill="#fff3a8"/>
  <circle cx="255" cy="160" r="20" fill="#f4b000" opacity=".18"/>
  <path d="M170 154h122" stroke="#f4b000" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
  <g transform="translate(68 218)">
    <path d="M0 0h94l18 20H18z" fill="url(#steel)"/>
    <path d="M142 0h76l18 20h-88z" fill="#c9d3dd"/>
    <circle cx="176" cy="10" r="7" fill="#071a36"/>
    <path d="M270 0h110v20H260z" fill="url(#steel)"/>
  </g>
</g>

<!-- 3D print -->
