name: Build unique product artwork
on:
  push:
    branches: [fix/global-unique-content-images-20261020]
permissions:
  contents: write
jobs:
  generate:
    if: "!contains(github.event.head_commit.message, '[art-generated]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate individual SVG product illustrations
        run: python3 scripts/generate_product_unique_art.py
      - name: Validate SVG uniqueness and image integrity
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET,hashlib
          paths=list(pathlib.Path('assets/images/product-unique').glob('*.svg'))
          for p in paths: ET.parse(p)
          assert len(paths)==119, len(paths)
          assert len({hashlib.sha256(p.read_bytes()).hexdigest() for p in paths})==len(paths)
          print('PASS',len(paths),'unique XML-valid product image assets')
          PY
      - name: Commit artwork to review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/product-unique/
          git commit -m 'Give every shared-image catalogue product unique artwork [art-generated]'
          git push origin HEAD:fix/global-unique-content-images-20261020
