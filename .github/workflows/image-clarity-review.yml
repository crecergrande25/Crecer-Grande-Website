name: Image clarity review
on:
  push:
    branches: [audit/remove-hazy-images-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-images:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python3 -m pip install Pillow --break-system-packages
      - name: Audit raster files and emit contact sheets
        run: python3 scripts/audit_raster_quality.py
