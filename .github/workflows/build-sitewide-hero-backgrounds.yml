name: Build and verify page hero backgrounds
on:
  push:
    branches: [feature/sitewide-image-background-heroes-20261021]
permissions:
  contents: write
jobs:
  build-hero-backgrounds:
    if: "!contains(github.event.head_commit.message, '[hero-generated]')"
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Build unique image-backed hero backgrounds
        run: python3 scripts/build_image_backed_heroes.py
      - name: Validate source links and hero image references
        run: |
          python3 scripts/check_site_quality.py
          python3 -m pip install Pillow --break-system-packages
          python3 scripts/check_image_assets.py
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile hero layouts
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/crecer-hero-server.log 2>&1 &
          sleep 3
          node scripts/check_sitewide_hero_backgrounds.cjs
          HERO_VIEWPORT=mobile node scripts/check_sitewide_hero_backgrounds.cjs
      - name: Preserve single-use imagery across the entire site
        run: |
          node scripts/check_live_image_uniqueness.cjs
          AUDIT_VIEWPORT=mobile node scripts/check_live_image_uniqueness.cjs
      - name: Commit validated public hero redesign to branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Convert 56 public heroes to distinct full-width background images [hero-generated]'
          git push origin HEAD:feature/sitewide-image-background-heroes-20261021
