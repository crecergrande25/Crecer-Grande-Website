name: Apply semantic heading repairs
on:
  push:
    branches: [fix/heading-hierarchy-sitewide-20261021]
permissions:
  contents: write
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[headings-done]')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Apply semantic heading transformations
        run: python3 scripts/fix_semantic_headings.py
      - name: Run website static checks
        run: |
          python3 scripts/check_site_quality.py
          node --check assets/js/site.js
          python3 scripts/audit_heading_hierarchy.py
      - name: Validate footer and hero heading structure
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root=Path('.')
          errors=[]
          pages=0
          for file in root.rglob('*.html'):
              p=file.as_posix()
              if p.startswith('admin/'):continue
              s=file.read_text(encoding='utf8')
              if re.search(r'<meta\b[^>]*http-equiv=["\x27]refresh',s,re.I):continue
              m=re.search(r'<main\b[^>]*>([\s\S]*?)</main>',s,re.I)
              if not m:errors.append(f'{p}: missing main');continue
              headings=[int(x) for x in re.findall(r'<h([1-6])\b',m.group(1),re.I)]
              if headings.count(1)!=1:errors.append(f'{p}: should have one main H1; found {headings.count(1)}')
              for i,n in enumerate(headings):
                  if n>(headings[i-1] if i else 0)+1:
                      errors.append(f'{p}: heading skipped level before H{n}')
              footer=re.search(r'<footer\b[^>]*class=["\x27][^"\x27]*cg-footer[^"\x27]*["\x27][^>]*>([\s\S]*?)</footer>',s,re.I)
              if footer and re.search(r'<h[3456]\b',footer.group(1),re.I):
                  errors.append(f'{p}: footer still uses overly deep heading')
              pages+=1
          for err in errors:print('ERROR',err)
          print('HEADING_CHECK|pages='+str(pages)+'|errors='+str(len(errors)))
          if errors:exit(1)
          PY
      - name: Commit corrections on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair website heading hierarchy without visual redesign [headings-done]'
          git push origin HEAD:fix/heading-hierarchy-sitewide-20261021
