name: Live broken image audit
on:
  push:
    branches: [audit/live-broken-images-20261020]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit live images on desktop
        run: node scripts/audit_live_images.cjs
      - name: Audit live images on mobile
        env:
          AUDIT_VIEWPORT: mobile
        run: node scripts/audit_live_images.cjs
