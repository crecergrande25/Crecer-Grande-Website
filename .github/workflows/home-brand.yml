name: Homepage headline and original logo

on:
  push:
    branches: [fix/home-headline-logo-20261021, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local website and check original logo plus hero typography
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/crecer-home-test.log 2>&1 &
          sleep 3
          node scripts/check_home_brand.cjs
