name: Create unique page illustrations

on:
  push:
    branches: [verify/global-image-single-use-20261021]

permissions:
  contents: write

jobs:
  illustrate:
    if: "!contains(github.event.head_commit.message, '[unique-art-done]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Generate individual SVG illustrations and replace text placeholders
        run: python3 scripts/create_unique_page_illustrations.py
      - name: Check page HTML and JavaScript
        run: |
          python3 scripts/check_site_quality.py
          for file in assets/js/*.js; do node --check "$file"; done
      - name: Commit unique artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Illustrate placeholders [unique-art-done]'
          git push origin HEAD:verify/global-image-single-use-20261021
