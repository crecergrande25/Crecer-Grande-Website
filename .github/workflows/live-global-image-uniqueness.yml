name: Live media accuracy and responsive layout

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-placements:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Wait for the latest sitewide background release
        run: |
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 15 https://crecergrande.in/services.html | grep -q 'experience.css?v=7.0.0'; then
              echo 'Sitewide image hero stylesheet is linked on the production domain.'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for sitewide hero styling.'
          exit 1
      - name: Check every live desktop page for loaded media integrity
        env:
          SITE_BASE: https://crecergrande.in
        run: node scripts/check_media accuracy.cjs
      - name: Check every live mobile page for loaded media integrity
        env:
          SITE_BASE: https://crecergrande.in
          AUDIT_VIEWPORT: mobile
        run: node scripts/check_media accuracy.cjs
