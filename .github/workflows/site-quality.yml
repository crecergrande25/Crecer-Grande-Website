name: Website quality

on:
  push:
    branches: [main, fix/website-quality-reliability-20261020]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML routes and sitemap
        run: python3 scripts/check_site_quality.py
      - name: Verify public page heading hierarchy
        run: python3 scripts/check_semantic_headings.py
      - name: Install Pillow for image decoding checks
        run: python3 -m pip install Pillow --break-system-packages
      - name: Verify every image asset and reference
        run: python3 scripts/check_image_assets.py
      - name: Verify engineering calculation accuracy and invalid inputs
        run: node --test scripts/check_calculators.cjs
      - name: Check JavaScript syntax
        run: |
          for script in assets/js/*.js admin/assets/*.js; do
            node --check "$script"
          done

  live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Test public production website
        run: python3 scripts/check_live_site.py
