name: Repair legacy footer headings
on:
  push:
    branches: [fix/heading-hierarchy-sitewide-20261021]
permissions:
  contents: write
jobs:
  finish:
    if: "!contains(github.event.head_commit.message, '[footer-headings-done]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining footer and help headings
        run: python3 scripts/fix_legacy_footer_headings.py
      - name: Verify semantic hierarchy and unchanged script parsing
        run: |
          python3 scripts/check_semantic_headings.py
          python3 scripts/check_site_quality.py
          node --check assets/js/site.js
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete H2 footer and widget headings [footer-headings-done]"
          git push origin HEAD:fix/heading-hierarchy-sitewide-20261021
