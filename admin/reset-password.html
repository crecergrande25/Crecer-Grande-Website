<!DOCTYPE html>
<html><head><meta charset="utf-8"/><meta content="width=device-width" name="viewport"/><meta content="noindex,nofollow" name="robots"/><title>Reset Password | Crecer Grande</title><link href="assets/admin.css" rel="stylesheet"/><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/runtime-config.js"></script></head><body><div class="login"><form class="login-card" id="reset"><img alt="Crecer Grande" src="../assets/images/logo.png"/><h1>Set new password</h1><label>New password<input id="p1" minlength="10" required="" type="password"/></label><label>Confirm password<input id="p2" minlength="10" required="" type="password"/></label><button class="primary">Update password</button><div class="status hidden" id="s"></div></form></div><script>const cfg=window.CG_CONFIG||{},c=(window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey)?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;document.getElementById('reset').onsubmit=async e=>{e.preventDefault();const s=document.getElementById('s'),a=p1.value,b=p2.value;s.classList.remove('hidden');if(!c)return s.textContent='Supabase is not configured.';if(a!==b)return s.textContent='Passwords do not match.';const r=await c.auth.updateUser({password:a});if(r.error)return s.textContent=r.error.message;try{await c.rpc('complete_password_change')}catch(x){}s.textContent='Password updated. You can return to Admin.'}</script></body></html>
